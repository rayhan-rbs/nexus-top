<!DOCTYPE html>
<html lang="bn" data-theme="dark" data-accent="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — NexusTop</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/preloader.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- <script src="https://www.paypal.com/sdk/js?client-id=BAAKGknrrwQcimlKmt4LT_mfhgQY_J-rV3vHSTudc2-hmu7RZnRU8ggUA19LNWiNRrqmg8cskcLCRFfcUY&currency=USD&intent=capture"></script> -->
  <style>
    .payment-container {
      min-height: 100vh;
      padding: 120px 20px 60px;
    }
    .payment-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }
    .order-summary-card {
      background: var(--bg-2);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 30px;
    }
    .order-summary-card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--glass-border);
    }
    .summary-row:last-child {
      border-bottom: none;
      font-weight: 700;
      font-size: 18px;
      color: var(--secondary);
    }
    .payment-methods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .payment-method-card {
      background: var(--glass);
      border: 2px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .payment-method-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }
    .payment-method-card.selected {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
    }
    .payment-method-card .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    .payment-method-card .name {
      font-weight: 600;
      margin-bottom: 5px;
    }
    .payment-method-card .desc {
      font-size: 12px;
      color: var(--text-dim);
    }
    .payment-instructions {
      background: var(--bg-2);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 30px;
      display: none;
    }
    .payment-instructions.active {
      display: block;
    }
    .payment-instructions h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .instruction-box {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .instruction-box .number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--secondary);
      margin: 10px 0;
      letter-spacing: 2px;
    }
    .copy-btn {
      padding: 8px 16px;
      background: var(--grad);
      border: none;
      border-radius: 100px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .copy-btn:hover {
      transform: scale(1.05);
    }
    .steps {
      list-style: none;
      counter-reset: step;
    }
    .steps li {
      counter-increment: step;
      padding: 15px 0 15px 50px;
      position: relative;
      border-bottom: 1px solid var(--glass-border);
    }
    .steps li:last-child {
      border-bottom: none;
    }
    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 15px;
      width: 35px;
      height: 35px;
      background: var(--grad);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
    }
    .transaction-form {
      background: var(--bg-2);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      display: none;
    }
    .transaction-form.active {
      display: block;
    }
    .transaction-form h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      margin-bottom: 20px;
    }
        /* ===== PAYMENT FORM STYLES ===== */
    .transaction-form .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .transaction-form .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .transaction-form .form-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .transaction-form .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
      background: var(--bg-3);
    }

    .transaction-form .form-input::placeholder {
      color: var(--text-dim);
    }

    .transaction-form .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--grad);
      border: none;
      border-radius: 100px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .transaction-form .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px color-mix(in srgb, var(--primary) 40%, transparent);
    }

    .transaction-form .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
        /* ===== GLOBAL BUTTON STYLES FOR PAYMENT PAGE ===== */
    .payment-container .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--grad);
      border: none;
      border-radius: 100px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .payment-container .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px color-mix(in srgb, var(--primary) 40%, transparent);
    }

    .payment-container .btn-submit:active {
      transform: translateY(0);
    }

    .payment-container .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <body>
  <!-- PRELOADER -->
  <div class="preloader-wrapper">
    <div class="preloader-particles"></div>
    <div class="preloader-logo">NEXUSTOP</div>
    <div class="preloader-spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <div class="preloader-text">LOADING...</div>
    <div class="preloader-progress">
      <div class="preloader-progress-bar"></div>
    </div>
  </div>

  <!-- আপনার বাকি HTML কোড এখানে -->
  <div class="mesh-bg"></div>
  <div class="particles" id="particles"></div>

  <!-- Navigation -->
  <nav>
    <div class="logo" onclick="window.location.href='index.html'">NEXUS<span>TOP</span></div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="window.location.href='index.html'" title="Home">🏠</button>
      <button class="icon-btn" onclick="window.location.href='orders.html'" title="Orders">📦</button>
    </div>
  </nav>

  <div class="payment-container">
    <div class="payment-wrapper">
      <h1 style="font-family:'Orbitron',sans-serif;font-size:36px;margin-bottom:30px;text-align:center">💳 Complete Payment</h1>

      <!-- Order Summary -->
      <div class="order-summary-card">
        <h2>Order Summary</h2>
        <div id="orderSummary">
          <p style="text-align:center;color:var(--text-dim)">Loading order details...</p>
        </div>
      </div>

      <!-- Payment Methods -->
      <h2 style="font-family:'Orbitron',sans-serif;font-size:24px;margin-bottom:20px">Select Payment Method</h2>
      <div class="payment-methods" id="paymentMethods">
        <p style="text-align:center;color:var(--text-dim);grid-column:1/-1">Loading payment methods...</p>
      </div>

      <!-- Payment Instructions -->
      <div class="payment-instructions" id="paymentInstructions">
        <h3 id="instructionTitle">Payment Instructions</h3>
        <div id="instructionContent"></div>
      </div>

      <!-- Transaction Form -->
      <div class="transaction-form" id="transactionForm">
        <h3>Submit Transaction ID</h3>
        <form id="manualPaymentForm">
          <div class="form-group">
            <label class="form-label">Transaction ID *</label>
            <input type="text" class="form-input" id="transactionId" placeholder="Enter your transaction ID" required>
            <small style="color:var(--text-dim);font-size:12px;margin-top:5px;display:block">
              You will find this in your bKash/Nagad/Rocket app after sending money
            </small>
          </div>
          <button type="submit" class="btn-submit" id="submitPaymentBtn">Submit Payment Proof</button>
        </form>
      </div>
    </div>
  </div>
    <!-- PayPal SDK (আপনার Client ID এখানেই আছে, এটি ঠিক আছে) -->
  <script defer src="https://www.paypal.com/sdk/js?client-id=BAAKGknrrwQcimlKmt4LT_mfhgQY_J-rV3vHSTudc2-hmu7RZnRU8ggUA19LNWiNRrqmg8cskcLCRFfcUY&currency=USD&intent=capture"></script> 

    <script src="js/preloader.js"></script>
  <script src="js/config.js"></script>
  <script src="js/authService.js"></script>
  <script src="js/orderService.js"></script>
  
  <script>
    // URL থেকে Order ID বের করা
    const urlParams = new URLSearchParams(window.location.search);
    const currentOrderId = urlParams.get('orderId');

    if (!currentOrderId) {
      alert('⚠️ No Order ID found!');
      window.location.href = 'index.html';
    }

    // PayPal বাটন রেন্ডার ফাংশন
    function renderPayPalButton() {
      // বাটন কন্টেইনার ক্লিয়ার করা
      const container = document.getElementById('paypal-button-container');
      if(container) container.innerHTML = '';

      paypal.Buttons({
        style: {
          layout: 'vertical',
          color: 'gold',
          shape: 'rect',
          label: 'paypal'
        },
        
        // ১. অর্ডার তৈরি করা
        createOrder: async function() {
          try {
            console.log('Creating PayPal order for:', currentOrderId);
            const token = authService.getToken();
            
            const res = await fetch(API_BASE_URL + '/api/payments/paypal/create-order', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({ orderId: currentOrderId })
            });

            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Failed to create order');
            
            console.log('✅ PayPal Order ID received:', data.orderId);
            return data.orderId; // এটি PayPal SDK কে রিটার্ন করতে হবে
            
          } catch (err) {
            console.error('❌ Create order error:', err);
            alert('❌ অর্ডার তৈরি করতে ব্যর্থ হয়েছে: ' + err.message);
            throw err;
          }
        },
        
        // ২. পেমেন্ট সফল হলে ব্যাকএন্ডে ক্যাপচার রিকোয়েস্ট পাঠানো
        onApprove: async function(data, actions) {
          try {
            console.log('Approving payment with PayPal Order ID:', data.orderID);
            const token = authService.getToken();
            
            // ✅ এখানে কোনো 'paypal' ভেরিয়েবল ব্যবহার করা হয়নি, শুধু fetch ব্যবহার করা হয়েছে
            const res = await fetch(API_BASE_URL + '/api/payments/paypal/capture', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({
                orderId: currentOrderId,
                paypalOrderId: data.orderID
              })
            });

            const paymentData = await res.json();
            
            if (!res.ok || !paymentData.success) {
              throw new Error(paymentData.error || 'Payment capture failed on server');
            }
            
            alert('✅ পেমেন্ট সফল হয়েছে! অর্ডার আইডি: ' + (paymentData.order ? paymentData.order.orderId : currentOrderId));
            
            // সফল হলে অর্ডার পেইজে রিডাইরেক্ট
            window.location.href = 'orders.html';
            
          } catch (err) {
            console.error('❌ Capture error:', err);
            alert('❌ পেমেন্ট ভেরিফাই করতে ব্যর্থ হয়েছে: ' + err.message);
          }
        },
        
        // ৩. কোনো এরর হলে
        onError: function(err) {
          console.error('💥 PayPal Button Error:', err);
          alert('❌ PayPal লোড হতে সমস্যা হচ্ছে। দয়া করে পেজ রিফ্রেশ করে আবার চেষ্টা করুন।');
        }

      }).render('#paypal-button-container');
    }

    // পেজ লোড হলে বাটন রেন্ডার কল করা
    document.addEventListener('DOMContentLoaded', () => {
      if (authService.isLoggedIn()) {
        renderPayPalButton();
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
