<!DOCTYPE html>
<html lang="bn" data-theme="dark" data-accent="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — NexusTop</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="mesh-bg"></div>
  <div class="particles" id="particles"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">NEXUS<span style="color:var(--secondary)">TOP</span></div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join the gaming revolution</p>
      </div>

      <div class="form-error" id="formError"></div>

      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" class="form-input" id="name" placeholder="Your Name" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone (Optional)</label>
          <input type="tel" class="form-input" id="phone" placeholder="01XXXXXXXXX">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-toggle">
            <input type="password" class="form-input" id="password" placeholder="Min 6 characters" required minlength="6">
            <button type="button" class="toggle-btn" onclick="togglePassword('password')">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>


  <script src="js/config.js"></script>
  <script src="js/authService.js"></script>
  <script>
    // Check if already logged in
    if (authService.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('formError');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';
      errorBox.classList.remove('show');

      const result = await authService.register(name, email, password, phone);

      if (result.success) {
        window.location.href = 'index.html';
      } else {
        errorBox.textContent = result.error;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    // Initialize particles
    const particlesContainer = document.getElementById('particles');
    for(let i=0;i<30;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random()*100+'%';
      p.style.animationDuration = (Math.random()*10+10)+'s';
      p.style.animationDelay = Math.random()*10+'s';
      p.style.opacity = Math.random()*0.5+0.2;
      particlesContainer.appendChild(p);
    }
  </script>
</body>
</html>
